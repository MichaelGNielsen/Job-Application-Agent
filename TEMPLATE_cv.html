<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>CV - {{NAVN}}</title>
    <style>
        @page { 
            size: A4; 
            margin: 2cm; 
        }
        @media print {
            @page { margin: 2cm; }
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            font-size: 10pt;
            line-height: 1.35; 
            color: #333; 
            max-width: 800px; 
            margin: auto; 
        }
        header { 
            border-bottom: 2px solid #444; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            display: flex;

        }
        .contact-info { line-height: 1.2; }
        .contact-info h1 { margin: 0 0 5px 0; font-size: 1.6em; color: #000; }
        .date-location { text-align: right; color: #666; font-size: 0.85em; }
        h1.section-title { 
            color: #000; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 3px; 
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        h2 { font-size: 10.5pt; margin: 8px 0 3px 0; }
        .job-title { font-weight: bold; }
        .company { font-style: italic; }
        .year { font-size: 9pt; color: #666; float: right; }
        ul { margin-top: 2px; margin-bottom: 6px; padding-left: 15px; }
        li { margin-bottom: 1px; }
        .section { margin-bottom: 6px; }
    </style>

<header>
    <div class="contact-info">
        <h1>{{NAVN}}</h1>
