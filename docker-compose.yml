services:
  redis:
    image: redis:alpine
    container_name: ja-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: ja-backend
    ports:
      - "9001:3002"
    environment:
      - REDIS_HOST=redis
      - PORT=3002
    env_file:
      - .env_private
      - .env_ai
    volumes:
      - ./backend:/app
      - /app/node_modules
      - .:/app/shared # Adgang til alle job mapperne
      - /home/mgn/.gemini:/root/.gemini
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ja-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Forhindrer at node_modules bliver overskrevet af den tomme lokale mappe
    depends_on:
      - backend
    restart: unless-stopped
