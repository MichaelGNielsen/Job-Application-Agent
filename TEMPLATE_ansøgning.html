<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Ansøgning - {{POSITION}}</title>
    <style>
        @page { 
            size: A4; 
            margin: 2cm; 
        }
        @media print {
            @page { margin: 2cm; }
        }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            line-height: 1.4; 
            color: #333; 
            max-width: 800px; 
            margin: auto; 
        }
        header { 
            border-bottom: 2px solid #444; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end;
        }
        .contact-info h1 { margin: 0; font-size: 1.4em; color: #000; }
        .date-location { text-align: right; color: #666; font-size: 0.85em; }
        .recipient { margin-bottom: 15px; font-weight: bold; line-height: 1.3; }
        h2 { color: #000; border-bottom: 1px solid #eee; padding-bottom: 3px; margin-top: 0; font-size: 1.1em; }
        p { margin-bottom: 10px; text-align: justify; }
        .signature { margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <div class="contact-info">
        <h1>{{NAVN}}</h1>
        {{ADRESSE}}<br>
        {{TELEFON}} | {{EMAIL}}
    </div>
    <div class="date-location">
        {{DATO}}
    </div>
</header>

<div class="recipient">
    Til: {{KONTAKT}},<br>
    {{FIRMA}}, {{BY}}
</div>

<h2>{{EMNE}}</h2>

{{INDHOLD}}

<div class="signature">
    {{AFSLUTNING}},<br><br>
    <strong>{{NAVN}}</strong>
</div>

</body>
</html>
